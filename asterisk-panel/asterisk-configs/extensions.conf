; =============================================================================
; AsteriskPanel - Dialplan Configuration
; =============================================================================
; This file is managed by AsteriskPanel. Manual edits may be overwritten.
; =============================================================================

[globals]
TRUNK_MESSAGENET=messagenet
TRUNK_TWILIO=twilio
PREFISSO_USCITA=0
RECORD_CALLS=yes
PARKINGEXT=700
PARKINGCONTEXT=parkedcalls

; ---- Internal Calls ----
[from-internal]
; Outbound calls via trunk (prefix 0)
exten => _0.,1,NoOp(Chiamata uscente da ${CALLERID(num)} verso ${EXTEN:1})
 same => n,Set(CDR(trunk)=${TRUNK_MESSAGENET})
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,GotoIf($["${RECORD_CALLS}" = "yes"]?record:dial)
 same => n(record),MixMonitor(${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN:1}.wav,b)
 same => n(dial),Dial(PJSIP/${EXTEN:1}@${TRUNK_MESSAGENET},60,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:noanswer)
 same => n(busy),Congestion(10)
 same => n,Hangup()
 same => n(noanswer),VoiceMail(${CALLERID(num)}@default,u)
 same => n,Hangup()

; Outbound calls via Twilio (prefix 8)
exten => _8.,1,NoOp(Chiamata uscente via Twilio da ${CALLERID(num)} verso ${EXTEN:1})
 same => n,Set(CDR(trunk)=${TRUNK_TWILIO})
 same => n,Dial(PJSIP/${EXTEN:1}@${TRUNK_TWILIO},60,tTkK)
 same => n,Hangup()

; Internal extension calls (3-digit: 100-199)
exten => _1XX,1,NoOp(Chiamata interna da ${CALLERID(num)} verso ${EXTEN})
 same => n,Set(__CALLID=${UNIQUEID})
 same => n,Dial(PJSIP/${EXTEN},30,tTkKm(ring))
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:noanswer)
 same => n(busy),Playback(vm-is-on-phone)
 same => n,Hangup()
 same => n(noanswer),VoiceMail(${EXTEN}@default,u)
 same => n,Hangup()

; Voicemail access
exten => *98,1,NoOp(Accesso Voicemail per ${CALLERID(num)})
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Voicemail access for specific mailbox
exten => *97,1,NoOp(Accesso Voicemail)
 same => n,VoiceMailMain(@default)
 same => n,Hangup()

; Call parking
exten => 700,1,NoOp(Park chiamata)
 same => n,Park(default,t(30))
 same => n,Hangup()

; Echo test
exten => *99,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

; Attended transfer
exten => _*1.,1,NoOp(Transfer assistito verso ${EXTEN:2})
 same => n,Dial(PJSIP/${EXTEN:2},30,tTkK)
 same => n,Hangup()

; DND toggle
exten => *78,1,NoOp(Attiva DND per ${CALLERID(num)})
 same => n,Set(DB(DND/${CALLERID(num)})=yes)
 same => n,Playback(do-not-disturb&activated)
 same => n,Hangup()

exten => *79,1,NoOp(Disattiva DND per ${CALLERID(num)})
 same => n,Set(DB(DND/${CALLERID(num)})=)
 same => n,Playback(do-not-disturb&de-activated)
 same => n,Hangup()

; Call forward
exten => _*72.,1,NoOp(Inoltro chiamata ${CALLERID(num)} verso ${EXTEN:3})
 same => n,Set(DB(CF/${CALLERID(num)})=${EXTEN:3})
 same => n,Playback(call-fwd-unconditional&for&extension)
 same => n,SayDigits(${EXTEN:3})
 same => n,Playback(activated)
 same => n,Hangup()

exten => *73,1,NoOp(Cancella inoltro per ${CALLERID(num)})
 same => n,Set(DB(CF/${CALLERID(num)})=)
 same => n,Playback(call-fwd-unconditional&de-activated)
 same => n,Hangup()

; Queue login/logout
exten => *45,1,NoOp(Login coda per ${CALLERID(num)})
 same => n,AddQueueMember(default,PJSIP/${CALLERID(num)})
 same => n,Playback(agent-loginok)
 same => n,Hangup()

exten => *46,1,NoOp(Logout coda per ${CALLERID(num)})
 same => n,RemoveQueueMember(default,PJSIP/${CALLERID(num)})
 same => n,Playback(agent-loggedoff)
 same => n,Hangup()

; ---- Incoming from MessageNet ----
[from-trunk-messagenet]
exten => _X.,1,NoOp(Chiamata in arrivo da MessageNet - ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(trunk)=messagenet)
 same => n,GotoIf($["${RECORD_CALLS}" = "yes"]?record:ring)
 same => n(record),MixMonitor(${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN}.wav,b)
 same => n(ring),Dial(PJSIP/100&PJSIP/101,20,tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy:noanswer)
 same => n(busy),VoiceMail(100@default,b)
 same => n,Hangup()
 same => n(noanswer),VoiceMail(100@default,u)
 same => n,Hangup()

exten => s,1,Goto(from-trunk-messagenet,100,1)

; ---- Incoming from Twilio ----
[from-trunk-twilio]
exten => _X.,1,NoOp(Chiamata in arrivo da Twilio - ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CDR(trunk)=twilio)
 same => n,Dial(PJSIP/100&PJSIP/101,20,tTkK)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

exten => s,1,Goto(from-trunk-twilio,100,1)

; ---- Incoming from Generic Trunk ----
[from-trunk-generic]
exten => _X.,1,NoOp(Chiamata in arrivo da trunk generico - ${CALLERID(num)})
 same => n,Dial(PJSIP/100,20,tTkK)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

exten => s,1,Goto(from-trunk-generic,100,1)

; ---- IVR Context ----
[ivr-main]
exten => s,1,NoOp(IVR Principale)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Background(welcome)
 same => n,WaitExten(5)
 same => n,Goto(s,1)

exten => 1,1,NoOp(IVR scelta 1 - Commerciale)
 same => n,Dial(PJSIP/100,30,tTkK)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

exten => 2,1,NoOp(IVR scelta 2 - Assistenza)
 same => n,Dial(PJSIP/101,30,tTkK)
 same => n,VoiceMail(101@default,u)
 same => n,Hangup()

exten => 0,1,NoOp(IVR scelta 0 - Operatore)
 same => n,Queue(default,tTkK,,,60)
 same => n,VoiceMail(100@default,u)
 same => n,Hangup()

exten => i,1,Playback(invalid)
 same => n,Goto(s,1)

exten => t,1,Goto(s,1)

; ---- Parked Calls ----
[parkedcalls]
; Default parking lot context

; =============================================================================
; AsteriskPanel - AMI (Asterisk Manager Interface) Configuration
; =============================================================================
; Copy this file to /etc/asterisk/manager.conf on your Asterisk server
; =============================================================================

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
;displayconnects = yes
;timestampevents = yes

; AsteriskPanel manager user
; Change username and password in production!
[admin]
secret = supersecret
deny = 0.0.0.0/0.0.0.0
permit = 0.0.0.0/0.0.0.0
read = all
write = all
writetimeout = 5000

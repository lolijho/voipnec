; =============================================================================
; AsteriskPanel - Queue Configuration
; =============================================================================
; Copy this file to /etc/asterisk/queues.conf on your Asterisk server
; =============================================================================

[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
shared_lastcall = yes
log_membername_as_agent = yes

[default]
musicclass = default
strategy = ringall
timeout = 15
retry = 5
wrapuptime = 10
maxlen = 0
announce-frequency = 60
announce-holdtime = yes
announce-position = yes
joinempty = yes
leavewhenempty = no
ringinuse = no

; Static members (can also be added dynamically via AMI/ARI)
; member => PJSIP/100
; member => PJSIP/101

[support]
musicclass = default
strategy = leastrecent
timeout = 20
retry = 5
wrapuptime = 15
maxlen = 10
announce-frequency = 30
announce-holdtime = yes
announce-position = yes
joinempty = yes
leavewhenempty = no
ringinuse = no

[sales]
musicclass = default
strategy = fewestcalls
timeout = 20
retry = 5
wrapuptime = 10
maxlen = 5
announce-frequency = 45
announce-holdtime = yes
joinempty = yes
leavewhenempty = no

; =============================================================================
; AsteriskPanel - PJSIP Configuration
; =============================================================================
; This file is managed by AsteriskPanel. Manual edits may be overwritten.
; =============================================================================

; ---- Transport Configuration ----

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12
external_media_address=
external_signaling_address=

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
cert_file=/etc/asterisk/keys/asterisk.pem
priv_key_file=/etc/asterisk/keys/asterisk.key
method=tlsv1_2

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; ---- Default Extension Template ----

[endpoint-template](!)
type=endpoint
transport=transport-udp
context=from-internal
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
ice_support=yes
media_use_received_transport=yes

[auth-template](!)
type=auth
auth_type=userpass

[aor-template](!)
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=30

; ---- Sample Extensions ----
; Extensions are auto-generated by AsteriskPanel

[100](endpoint-template)
auth=100-auth
aors=100-aor
callerid="Interno 100" <100>
mailbox=100@default

[100-auth](auth-template)
username=100
password=changeme100

[100-aor](aor-template)

[101](endpoint-template)
auth=101-auth

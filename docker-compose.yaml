version: '3.8'

services:
  asterisk-panel:
    build:
      context: ./asterisk-panel
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ASTERISK_HOST=${ASTERISK_HOST:-127.0.0.1}
      - ASTERISK_AMI_PORT=${ASTERISK_AMI_PORT:-5038}
      - ASTERISK_AMI_USER=${ASTERISK_AMI_USER:-admin}
      - ASTERISK_AMI_PASSWORD=${ASTERISK_AMI_PASSWORD:-supersecret}
      - ASTERISK_ARI_URL=${ASTERISK_ARI_URL:-http://127.0.0.1:8088}
      - ASTERISK_ARI_USER=${ASTERISK_ARI_USER:-ariuser}
      - ASTERISK_ARI_PASSWORD=${ASTERISK_ARI_PASSWORD:-arisecret}
      - JWT_SECRET=${JWT_SECRET:-cambia-questo-segreto}
      - DB_PATH=/data/asterisk-panel.db
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    volumes:
      - panel-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  panel-data:
    driver: local
